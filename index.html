<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏠 家庭學習金</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Noto+Serif+TC:wght@400;600;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ===================== 設計變數 ===================== */
:root{
  --ink:#2b1d12;
  --paper:#f5e8c7;
  --paper-2:#ead7a3;
  --gold:#c9a14a;
  --gold-deep:#8a6a23;
  --red-seal:#a8332b;
  --green:#5a8a3a;
  --teal:#3e7c8a;
  --pink:#d97a8c;
  --shadow:rgba(43,29,18,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Serif TC',serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at top left, #f7ecc8 0%, transparent 60%),
    radial-gradient(ellipse at bottom right, #e8d4a0 0%, transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 20px, rgba(138,106,35,.04) 20px 21px),
    var(--paper);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%, transparent 0%, rgba(138,106,35,.08) 100%),
    radial-gradient(circle at 80% 70%, transparent 0%, rgba(168,51,43,.04) 100%);
  z-index:0;
}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 100px}

.font-display{font-family:'Cherry Bomb One',cursive;letter-spacing:.02em}

/* ===================== 頂端 ===================== */
.header{text-align:center;padding:20px 0 16px;position:relative}
.header h1{
  font-family:'Cherry Bomb One',cursive;
  font-size:32px;color:var(--ink);
  text-shadow:2px 2px 0 var(--gold);
  margin-bottom:4px;
}
.header .sub{
  font-size:12px;color:var(--gold-deep);letter-spacing:.3em;
  text-transform:uppercase;font-weight:600;
}
.header::after{
  content:"";display:block;width:60px;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:12px auto 0;
}

/* ===================== 登入畫面 ===================== */
.login-screen{
  display:flex;flex-direction:column;align-items:center;
  min-height:60vh;padding-top:20px;
}
.login-title{
  font-family:'Cherry Bomb One',cursive;
  font-size:24px;margin-bottom:8px;
}
.login-sub{font-size:13px;color:var(--gold-deep);margin-bottom:32px}

.avatar-list{
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;
}
.avatar-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:transform .2s;
  padding:12px;border-radius:18px;
  background:linear-gradient(135deg, #fbf4dc 0%, #f0dfaf 100%);
  border:2px solid var(--gold);
  min-width:90px;
  box-shadow:0 3px 0 var(--gold-deep);
}
.avatar-card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.avatar-card.selected{
  background:var(--ink);color:var(--paper);
  border-color:var(--ink);
}
.avatar-emoji{font-size:48px;line-height:1}
.avatar-name{font-size:14px;font-weight:600}
.avatar-role{font-size:11px;color:var(--gold-deep)}
.avatar-card.selected .avatar-role{color:var(--gold)}

/* PIN 鍵盤 */
.pin-display{
  display:flex;gap:8px;justify-content:center;margin:16px 0 20px;
}
.pin-dot{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--ink);background:transparent;
}
.pin-dot.filled{background:var(--ink)}

.pin-keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:260px;margin:0 auto;
}
.pin-key{
  background:var(--paper);border:2px solid var(--ink);
  border-radius:14px;padding:16px;font-size:22px;
  font-family:'Cherry Bomb One',cursive;color:var(--ink);
  cursor:pointer;
  box-shadow:0 3px 0 var(--ink);
  transition:all .1s;
}
.pin-key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pin-key.back{background:var(--red-seal);color:white;border-color:var(--red-seal);box-shadow:0 3px 0 #6e1f1a;font-size:14px}
.pin-key.cancel{background:transparent;color:var(--gold-deep);border-color:transparent;box-shadow:none;font-size:14px}

/* ===================== 身份徽章 ===================== */
.user-greeting{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;font-size:14px;
}
.user-info{display:flex;align-items:center;gap:8px;color:var(--gold-deep)}
.user-info strong{color:var(--ink);font-size:16px}
.user-info .avatar-small{font-size:24px}
.role-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--ink);color:var(--paper);
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
}
.role-badge.parent{background:var(--teal)}
.role-badge.child{background:var(--pink)}
.btn-logout{
  background:transparent;border:1px solid var(--gold-deep);
  color:var(--gold-deep);padding:4px 10px;border-radius:14px;
  font-size:11px;cursor:pointer;
}

/* ===================== Tab 切換 ===================== */
.tabs{
  display:flex;gap:4px;margin-bottom:20px;
  background:rgba(43,29,18,.06);padding:4px;border-radius:14px;
  overflow-x:auto;
}
.tab{
  flex:1;min-width:60px;
  padding:8px 4px;text-align:center;
  border:none;background:transparent;cursor:pointer;
  font-family:'Noto Serif TC',serif;font-size:12px;font-weight:600;
  color:var(--gold-deep);
  border-radius:10px;
  transition:all .2s;
}
.tab.active{
  background:var(--ink);color:var(--paper);
  box-shadow:0 2px 8px var(--shadow);
}
.tab .ico{display:block;font-size:18px;margin-bottom:2px}

/* ===================== 卡片 ===================== */
.card{
  background:linear-gradient(135deg, #fbf4dc 0%, #f0dfaf 100%);
  border:1px solid var(--gold);
  border-radius:18px;
  padding:20px;margin-bottom:16px;
  box-shadow:0 2px 0 var(--gold-deep),0 6px 16px var(--shadow);
}
.card-title{
  font-family:'Cherry Bomb One',cursive;
  font-size:18px;color:var(--ink);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}

/* ===================== 三罐 ===================== */
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.jar{
  background:var(--paper);border:2px solid var(--ink);border-radius:14px;
  padding:14px 8px;text-align:center;position:relative;overflow:hidden;
}
.jar .icon{font-size:36px;line-height:1;margin-bottom:4px;display:block}
.jar .label{font-size:11px;color:var(--gold-deep);font-weight:600;letter-spacing:.1em}
.jar .amount{
  font-family:'Cherry Bomb One',cursive;
  font-size:22px;color:var(--ink);margin-top:4px;
}
.jar.consume{background:linear-gradient(180deg,#fde2e7 50%,#fbc4cc 50%)}
.jar.goal{background:linear-gradient(180deg,#fef3c7 50%,#fde68a 50%)}
.jar.share{background:linear-gradient(180deg,#dcfce7 50%,#bbf7d0 50%)}

.balance-total{
  text-align:center;padding:14px;
  background:var(--ink);color:var(--paper);
  border-radius:14px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.balance-total::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(201,161,74,.1) 6px 7px);
}
.balance-total .label{font-size:12px;letter-spacing:.3em;color:var(--gold);position:relative}
.balance-total .amount{
  font-family:'Cherry Bomb One',cursive;
  font-size:42px;color:var(--paper);position:relative;
}

/* ===================== 按鈕 ===================== */
.btn{
  padding:10px 16px;border:none;border-radius:12px;cursor:pointer;
  font-family:'Noto Serif TC',serif;font-weight:600;font-size:14px;
  transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #0f0a06}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #0f0a06}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-deep)}
.btn-gold:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.btn-red{background:var(--red-seal);color:white;box-shadow:0 3px 0 #6e1f1a}
.btn-green{background:var(--green);color:white;box-shadow:0 3px 0 #3d5e26}
.btn-block{width:100%;padding:14px}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* ===================== 列表 ===================== */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  background:rgba(255,255,255,.5);border:1px solid rgba(138,106,35,.2);
  border-radius:10px;padding:10px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;
}
.list-item .left{flex:1;min-width:0}
.list-item .title{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .meta{font-size:11px;color:var(--gold-deep);margin-top:2px}
.list-item .amount{font-weight:700;white-space:nowrap;margin-left:8px}
.list-item .amount.income{color:var(--green)}
.list-item .amount.expense{color:var(--red-seal)}

.empty{text-align:center;color:var(--gold-deep);padding:30px;font-size:13px}

/* ===================== 表單 ===================== */
.form-group{margin-bottom:12px}
.form-group label{
  display:block;font-size:12px;color:var(--gold-deep);
  font-weight:600;margin-bottom:4px;letter-spacing:.1em;
}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--gold);background:rgba(255,255,255,.6);
  border-radius:10px;font-family:'Noto Serif TC',serif;font-size:14px;
  color:var(--ink);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--ink);background:white;
}

/* ===================== Modal ===================== */
.modal-mask{
  position:fixed;inset:0;background:rgba(43,29,18,.5);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal-mask.show{display:flex}
.modal{
  background:var(--paper);border:2px solid var(--ink);
  border-radius:18px;padding:24px;max-width:400px;width:100%;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 8px 0 var(--ink),0 20px 40px rgba(0,0,0,.3);
}
.modal-title{
  font-family:'Cherry Bomb One',cursive;
  font-size:22px;text-align:center;margin-bottom:16px;
}

/* ===================== 狀態徽章 ===================== */
.status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status-pending{background:#fef3c7;color:#92400e}
.status-approved{background:#dcfce7;color:#166534}
.status-rejected{background:#fee2e2;color:#991b1b}

/* ===================== Toast ===================== */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);
  padding:12px 24px;border-radius:24px;
  font-size:14px;font-weight:600;
  opacity:0;transition:all .3s;
  z-index:200;pointer-events:none;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none !important}

/* ===================== 月報 ===================== */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.report-stat{
  background:rgba(255,255,255,.5);border:1px solid var(--gold);
  border-radius:10px;padding:10px;text-align:center;
}
.report-stat .label{font-size:11px;color:var(--gold-deep)}
.report-stat .value{font-family:'Cherry Bomb One',cursive;font-size:20px;color:var(--ink)}

.loading-screen{
  text-align:center;padding:60px 20px;color:var(--gold-deep);
}
.loading-screen .spinner{
  display:inline-block;width:30px;height:30px;
  border:3px solid var(--gold);border-top-color:transparent;
  border-radius:50%;animation:spin 1s linear infinite;
  margin-bottom:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">

  <!-- ===== 頂端 ===== -->
  <div class="header">
    <h1>🏠 家庭學習金</h1>
    <div class="sub">FAMILY · LEARNING · QUEST</div>
  </div>

  <!-- ===== 載入畫面 ===== -->
  <div id="loadingScreen" class="loading-screen hidden">
    <div class="spinner"></div>
    <div>載入中...</div>
  </div>

  <!-- ===== 登入畫面（選頭像）===== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-title">📜 請選擇你是誰</div>
    <div class="login-sub">點頭像登入</div>
    <div class="avatar-list" id="avatarList">
      <!-- 動態載入 -->
    </div>
  </div>

  <!-- ===== PIN 輸入畫面 ===== -->
  <div id="pinScreen" class="login-screen hidden">
    <div class="login-title" id="pinTitle">請輸入密碼</div>
    <div class="login-sub" id="pinSubtitle">4 位數字密碼</div>

    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>

    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key cancel" onclick="pinCancel()">取消</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key back" onclick="pinBack()">⌫</button>
    </div>
  </div>

  <!-- ===== 主畫面 ===== -->
  <div id="mainScreen" class="hidden">

    <div class="user-greeting">
      <div class="user-info">
        <span class="avatar-small" id="userAvatar">👤</span>
        <strong id="userName">--</strong>
        <span id="userBadge" class="role-badge">--</span>
      </div>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabsBar">
      <button class="tab active" data-tab="home"><span class="ico">🏠</span>主頁</button>
      <button class="tab" data-tab="ledger"><span class="ico">📒</span>帳本</button>
      <button class="tab" data-tab="bonus"><span class="ico">🏆</span>獎金</button>
      <button class="tab" data-tab="course"><span class="ico">📚</span>課程</button>
      <button class="tab" data-tab="report"><span class="ico">📊</span>月報</button>
      <button class="tab" data-tab="setting"><span class="ico">⚙️</span>設定</button>
    </div>

    <!-- ===== Tab: 主頁 ===== -->
    <div id="tab-home" class="tab-content">
      <div class="balance-total">
        <div class="label">TOTAL</div>
        <div class="amount" id="totalBalance">$0</div>
      </div>

      <div class="jars">
        <div class="jar consume">
          <span class="icon">🐷</span>
          <div class="label">消費</div>
          <div class="amount" id="jarConsume">$0</div>
        </div>
        <div class="jar goal">
          <span class="icon">🎯</span>
          <div class="label">目標</div>
          <div class="amount" id="jarGoal">$0</div>
        </div>
        <div class="jar share">
          <span class="icon">❤️</span>
          <div class="label">分享</div>
          <div class="amount" id="jarShare">$0</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 最近紀錄</div>
        <div id="recentList" class="list">
          <div class="empty">尚無紀錄</div>
        </div>
      </div>

      <div class="card parent-only">
        <div class="card-title">⚡ 家長快捷</div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="openModal('modalIncome')">+ 收入</button>
          <button class="btn btn-red" onclick="openModal('modalExpense')">- 支出</button>
        </div>
        <button class="btn btn-gold btn-block" style="margin-top:8px" onclick="doMonthlyCharge()">
          💸 本月課程扣款
        </button>
      </div>
    </div>

    <!-- ===== Tab: 帳本 ===== -->
    <div id="tab-ledger" class="tab-content hidden">
      <div class="card">
        <div class="card-title">📒 完整帳本</div>
        <div id="ledgerList" class="list"></div>
      </div>
    </div>

    <!-- ===== Tab: 獎金 ===== -->
    <div id="tab-bonus" class="tab-content hidden">
      <div class="card child-only">
        <div class="card-title">🏆 申請獎金</div>
        <button class="btn btn-gold btn-block" onclick="openModal('modalBonusApply')">
          📝 我要申請獎金
        </button>
      </div>

      <div class="card">
        <div class="card-title">📋 申請紀錄</div>
        <div id="bonusList" class="list"></div>
      </div>
    </div>

    <!-- ===== Tab: 課程 ===== -->
    <div id="tab-course" class="tab-content hidden">
      <div class="card parent-only">
        <div class="card-title">📚 課程管理</div>
        <button class="btn btn-gold btn-block" onclick="openCourseEditor()">
          ➕ 新增課程
        </button>
      </div>
      <div class="card">
        <div class="card-title">📋 課程清單</div>
        <div id="courseList" class="list"></div>
      </div>
    </div>

    <!-- ===== Tab: 月報 ===== -->
    <div id="tab-report" class="tab-content hidden">
      <div class="card">
        <div class="card-title">📊 月度結算</div>
        <div class="form-group">
          <label>選擇月份</label>
          <input type="month" id="reportMonth" onchange="loadReport()">
        </div>
        <div id="reportContent"></div>
      </div>
    </div>

    <!-- ===== Tab: 設定 ===== -->
    <div id="tab-setting" class="tab-content hidden">
      <div class="card">
        <div class="card-title">🔐 修改密碼</div>
        <div class="form-group">
          <label>舊密碼（4 位數）</label>
          <input type="password" id="oldPwd" maxlength="4" inputmode="numeric">
        </div>
        <div class="form-group">
          <label>新密碼（4 位數）</label>
          <input type="password" id="newPwd" maxlength="4" inputmode="numeric">
        </div>
        <div class="form-group">
          <label>再次輸入新密碼</label>
          <input type="password" id="confirmPwd" maxlength="4" inputmode="numeric">
        </div>
        <button class="btn btn-gold btn-block" onclick="changePassword()">儲存新密碼</button>
      </div>

      <div class="card parent-only">
        <div class="card-title">⚙️ 系統設定</div>
        <div id="settingList" class="list"></div>
      </div>
    </div>

  </div>

</div>

<!-- ===================== Modal: 收入 ===================== -->
<div class="modal-mask" id="modalIncome">
  <div class="modal">
    <div class="modal-title">💰 新增收入</div>
    <div class="form-group">
      <label>項目</label>
      <input type="text" id="incomeItem" placeholder="例：週零用金">
    </div>
    <div class="form-group">
      <label>金額</label>
      <input type="number" id="incomeAmount" placeholder="100">
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <input type="text" id="incomeNote">
    </div>
    <p style="font-size:12px;color:var(--gold-deep);margin-bottom:12px">
      ✨ 自動依比例分配到三罐（4:4:2）
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="closeModal('modalIncome')">取消</button>
      <button class="btn btn-green" onclick="submitIncome()">確認</button>
    </div>
  </div>
</div>

<!-- ===================== Modal: 支出 ===================== -->
<div class="modal-mask" id="modalExpense">
  <div class="modal">
    <div class="modal-title">💸 新增支出</div>
    <div class="form-group">
      <label>項目</label>
      <input type="text" id="expenseItem">
    </div>
    <div class="form-group">
      <label>金額</label>
      <input type="number" id="expenseAmount">
    </div>
    <div class="form-group">
      <label>從哪一罐扣？</label>
      <select id="expenseFrom">
        <option value="consume">🐷 消費罐</option>
        <option value="goal">🎯 目標罐</option>
        <option value="share">❤️ 分享罐</option>
      </select>
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <input type="text" id="expenseNote">

</div>

<div class="modal-mask" id="modalCourse">
  <div class="modal">
    <div class="modal-title" id="modalCourseTitle">📚 新增課程</div>
    <input type="hidden" id="courseId">
    <div class="form-group">

      <input type="text" id="courseName">

      <select id="courseCategory" onchange="autoFillCourseRatio()">

<div class="toast" id="toast"></div>

<script>
// ========================================================
// ⚙️ 設定區（部署後請修改 GAS_URL）
// ========================================================
const CONFIG = {
  // 🔴 部署 GAS 後，將 Web App URL 貼到這裡
  GAS_URL: 'https://script.google.com/macros/s/REPLACE_WITH_YOUR_GAS_URL/exec'
};

let state = {
  accountId: null,
  role: null,
  name: null,
  avatar: null,
  nickname: null,
  selectedMember: null,
  pinInput: '',
  members: []
};

// ========================================================
// 🚀 啟動
// ========================================================
async function init() {
  // 檢查 localStorage 是否有登入
  const saved = localStorage.getItem('familyMoney_session');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      state.accountId = s.accountId;
      state.role = s.role;
      state.name = s.name;
      state.avatar = s.avatar;
      state.nickname = s.nickname;
      showMain();
      return;
    } catch (e) {}
  }
  await loadMembers();
}

async function loadMembers() {
  showLoading();
  const res = await callApi('memberListPublic', {});
  if (res.ok) {
    state.members = res.data;
    renderAvatars();
    showLogin();
  } else {
    showToast('載入失敗，請確認 GAS_URL 設定');
    showLogin();
  }
}

function renderAvatars() {
  const list = document.getElementById('avatarList');
  list.innerHTML = state.members.map(m => `
    <div class="avatar-card" onclick="selectMember('${m.accountId}')">
      <div class="avatar-emoji">${m.avatar || '👤'}</div>
      <div class="avatar-name">${m.nickname || m.name}</div>
      <div class="avatar-role">${m.role}</div>
    </div>
  `).join('');
}

function selectMember(accountId) {
  state.selectedMember = state.members.find(m => m.accountId === accountId);
  state.pinInput = '';
  document.getElementById('pinTitle').textContent = state.selectedMember.avatar + ' ' + state.selectedMember.nickname;
  document.getElementById('pinSubtitle').textContent = '請輸入 4 位數密碼';
  updatePinDots();
  showPinScreen();
}

function pinPress(digit) {
  if (state.pinInput.length >= 4) return;
  state.pinInput += digit;
  updatePinDots();
  if (state.pinInput.length === 4) {
    setTimeout(submitPin, 200);
  }
}

function pinBack() {
  state.pinInput = state.pinInput.slice(0, -1);
  updatePinDots();
}

function pinCancel() {
  state.pinInput = '';
  state.selectedMember = null;
  showLogin();
}

function updatePinDots() {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('filled', i < state.pinInput.length);
  });
}

async function submitPin() {
  showLoading();
  const res = await callApi('memberLogin', {
    accountId: state.selectedMember.accountId,
    password: state.pinInput
  });

  if (res.ok) {
    state.accountId = res.data.accountId;
    state.role = res.data.role;
    state.name = res.data.name;
    state.nickname = res.data.nickname;
    state.avatar = res.data.avatar;

    // 儲存登入狀態
    localStorage.setItem('familyMoney_session', JSON.stringify({
      accountId: state.accountId,
      role: state.role,
      name: state.name,
      nickname: state.nickname,
      avatar: state.avatar
    }));

    if (res.data.needsPasswordChange) {
      showToast('⚠️ 您使用預設密碼，建議至「設定」修改');
    }

    showMain();
  } else {
    showToast('❌ ' + (res.error || '密碼錯誤'));
    state.pinInput = '';
    updatePinDots();
    showPinScreen();
  }
}

function logout() {
  if (!confirm('確定要登出嗎？')) return;
  localStorage.removeItem('familyMoney_session');
  location.reload();
}

// ========================================================
// 📡 API 呼叫
// ========================================================
async function callApi(fn, params = {}) {
  try {
    const url = CONFIG.GAS_URL + '?fn=' + fn
      + '&params=' + encodeURIComponent(JSON.stringify(params));
    const res = await fetch(url);
    return await res.json();
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

// ========================================================
// 🎨 UI 控制
// ========================================================
function hideAll() {
  ['loginScreen', 'pinScreen', 'mainScreen', 'loadingScreen'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

function showLoading() { hideAll(); document.getElementById('loadingScreen').classList.remove('hidden'); }
function showLogin() { hideAll(); document.getElementById('loginScreen').classList.remove('hidden'); }
function showPinScreen() { hideAll(); document.getElementById('pinScreen').classList.remove('hidden'); }

function showMain() {
  hideAll();
  document.getElementById('mainScreen').classList.remove('hidden');

  document.getElementById('userAvatar').textContent = state.avatar || '👤';
  document.getElementById('userName').textContent = state.nickname || state.name;
  const badge = document.getElementById('userBadge');
  badge.textContent = state.role;
  badge.className = 'role-badge ' + (isParent() ? 'parent' : 'child');

  document.querySelectorAll('.parent-only').forEach(el => {
    el.style.display = isParent() ? '' : 'none';
  });
  document.querySelectorAll('.child-only').forEach(el => {
    el.style.display = isChild() ? '' : 'none';
  });

  loadHome();
}

function isParent() { return state.role === '爸' || state.role === '媽'; }
function isChild() { return state.role === '女兒'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// Tab 切換
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById('tab-' + tab).classList.remove('hidden');

    if (tab === 'home') loadHome();
    if (tab === 'ledger') loadLedger();
    if (tab === 'bonus') loadBonus();
    if (tab === 'course') loadCourse();
    if (tab === 'report') {
      const m = new Date().toISOString().slice(0,7);
      document.getElementById('reportMonth').value = m;
      loadReport();
    }
    if (tab === 'setting') loadSettings();
  });
});

// ========================================================
// 🏠 主頁
// ========================================================
async function loadHome() {
  const balRes = await callApi('ledgerBalance', { accountId: state.accountId });
  if (balRes.ok) {
    document.getElementById('totalBalance').textContent = '$' + (balRes.data.total || 0);
    document.getElementById('jarConsume').textContent = '$' + (balRes.data.consume || 0);
    document.getElementById('jarGoal').textContent = '$' + (balRes.data.goal || 0);
    document.getElementById('jarShare').textContent = '$' + (balRes.data.share || 0);
  }

  const listRes = await callApi('ledgerList', { accountId: state.accountId });
  const container = document.getElementById('recentList');
  if (listRes.ok && listRes.data.length > 0) {
    container.innerHTML = listRes.data.slice(0, 5).map(renderLedgerItem).join('');
  } else {
    container.innerHTML = '<div class="empty">尚無紀錄</div>';
  }
}

function renderLedgerItem(d) {
  const isIncome = d['類型'] === '收入';
  const sign = isIncome ? '+' : '-';
  const cls = isIncome ? 'income' : 'expense';
  return `<div class="list-item">
    <div class="left">
      <div class="title">${d['項目'] || '-'}</div>
      <div class="meta">${formatDateShort(d['日期時間'])}</div>
    </div>
    <div class="amount ${cls}">${sign}$${d['金額']}</div>
  </div>`;
}

function formatDateShort(d) {
  if (!d) return '';
  const date = new Date(d);
  return (date.getMonth()+1) + '/' + date.getDate() + ' ' +
    String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
}

// ========================================================
// 📒 帳本
// ========================================================
async function loadLedger() {
  const res = await callApi('ledgerList', { accountId: state.accountId });
  const container = document.getElementById('ledgerList');
  if (res.ok && res.data.length > 0) {
    container.innerHTML = res.data.map(renderLedgerItem).join('');
  } else {
    container.innerHTML = '<div class="empty">尚無紀錄</div>';
  }
}

async function submitIncome() {
  const item = document.getElementById('incomeItem').value;
  const amount = parseInt(document.getElementById('incomeAmount').value);
  const note = document.getElementById('incomeNote').value;
  if (!item || !amount) { showToast('請填寫項目與金額'); return; }

  const res = await callApi('ledgerAdd', {
    accountId: state.accountId, type: '收入', item, amount, allocate: true, note
  });
  if (res.ok) {
    showToast('✅ 已新增收入');
    closeModal('modalIncome');
    document.getElementById('incomeItem').value = '';
    document.getElementById('incomeAmount').value = '';
    document.getElementById('incomeNote').value = '';
    loadHome();
  } else {
    showToast('失敗：' + res.error);
  }
}

async function submitExpense() {
  const item = document.getElementById('expenseItem').value;
  const amount = parseInt(document.getElementById('expenseAmount').value);
  const from = document.getElementById('expenseFrom').value;
  const note = document.getElementById('expenseNote').value;
  if (!item || !amount) { showToast('請填寫項目與金額'); return; }

  const res = await callApi('ledgerAdd', {
    accountId: state.accountId, type: '支出', item, amount, from, note
  });
  if (res.ok) {
    showToast('✅ 已扣款');
    closeModal('modalExpense');
    document.getElementById('expenseItem').value = '';
    document.getElementById('expenseAmount').value = '';
    loadHome();
  } else {
    showToast('失敗：' + res.error);
  }
}

async function doMonthlyCharge() {
  if (!confirm('確定要執行本月所有課程的女兒負擔扣款嗎？')) return;
  const res = await callApi('courseMonthlyCharge', { accountId: state.accountId });
  if (res.ok) {
    showToast('✅ 已扣款 ' + (res.data.charged.length) + ' 筆');
    loadHome();
  } else {
    showToast('失敗：' + res.error);
  }
}

// ========================================================
// 🏆 獎金
// ========================================================
async function loadBonus() {
  const res = await callApi('bonusList', { accountId: state.accountId });
  const container = document.getElementById('bonusList');
  if (res.ok && res.data.length > 0) {
    container.innerHTML = res.data.map(renderBonusItem).join('');
  } else {
    container.innerHTML = '<div class="empty">尚無申請紀錄</div>';
  }
}

function renderBonusItem(d) {
  const statusMap = {
    '待審核': 'status-pending',
    '已核准': 'status-approved',
    '已拒絕': 'status-rejected'
  };
  const canReview = isParent() && d['審核狀態'] === '待審核';
  const applicant = state.members.find(m => m.accountId === d['申請人']);
  const applicantName = applicant ? (applicant.avatar + ' ' + (applicant.nickname || applicant.name)) : d['申請人'];

  return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="title">${d['事項'] || d['獎金類型']}</div>
      <div class="amount" style="color:var(--gold-deep)">$${d['金額']}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--gold-deep)">
      <span>${applicantName} · ${formatDateShort(d['申請日期'])}</span>
      <span class="status ${statusMap[d['審核狀態']] || ''}">${d['審核狀態']}</span>
    </div>
    ${canReview ? `<div class="btn-row" style="margin-top:6px">
      <button class="btn btn-red" onclick="reviewBonus('${d['申請ID']}','reject')">❌ 拒絕</button>
      <button class="btn btn-green" onclick="reviewBonus('${d['申請ID']}','approve')">✅ 核准撥款</button>
    </div>` : ''}
  </div>`;
}

function suggestBonusAmount() {
  const select = document.getElementById('bonusType');
  const amount = select.options[select.selectedIndex].dataset.amount;
  if (amount && amount !== '0') {
    document.getElementById('bonusAmount').value = amount;
  }
}

async function submitBonus() {
  const bonusType = document.getElementById('bonusType').value;
  const event = document.getElementById('bonusEvent').value;
  const amount = parseInt(document.getElementById('bonusAmount').value);
  const proof = document.getElementById('bonusProof').value;

  if (!event || !amount) { showToast('請填寫事項與金額'); return; }

  const res = await callApi('bonusApply', {
    accountId: state.accountId, bonusType, event, amount, proofUrl: proof
  });
  if (res.ok) {
    showToast('🎉 申請已遞交，等待家長審核');
    closeModal('modalBonusApply');
    document.getElementById('bonusEvent').value = '';
    document.getElementById('bonusAmount').value = '';
    document.getElementById('bonusProof').value = '';
    loadBonus();
  } else {
    showToast('失敗：' + res.error);
  }
}

async function reviewBonus(id, decision) {
  const text = decision === 'approve' ? '核准並撥款' : '拒絕';
  if (!confirm(`確定要${text}此申請嗎？`)) return;

  const res = await callApi('bonusReview', {
    accountId: state.accountId, id, decision
  });
  if (res.ok) {
    showToast('✅ 已' + text);
    loadBonus();
  } else {
    showToast('失敗：' + res.error);
  }
}

// ========================================================
// 📚 課程
// ========================================================
async function loadCourse() {
  const res = await callApi('courseList', {});
  const container = document.getElementById('courseList');
  if (res.ok && res.data.length > 0) {
    container.innerHTML = res.data.map(renderCourseItem).join('');
  } else {
    container.innerHTML = '<div class="empty">尚無課程</div>';
  }
}

function renderCourseItem(c) {
  const catColor = {
    '必修': '#a8332b',
    '半自付': '#c9a14a',
    '全自付': '#5a8a3a'
  };
  const fee = Number(c['月費']) || 0;
  const childRatio = Number(c['女兒負擔比例']) || 0;
  const childPay = Math.floor(fee * childRatio);
  const isP = isParent();
  return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:4px;cursor:${isP?'pointer':'default'}"
    ${isP ? `onclick="editCourse('${c['課程ID']}')"` : ''}>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="title">${c['課程名稱']}</div>
      <span class="status" style="background:${catColor[c['分類']] || '#888'};color:white">${c['分類']}</span>
    </div>
    <div class="meta" style="font-size:12px;color:var(--gold-deep)">
      月費 $${fee}　女兒負擔 $${childPay}（${Math.round(childRatio*100)}%）
    </div>
  </div>`;
}

let editingCourse = null;
function openCourseEditor() {
  editingCourse = null;
  document.getElementById('modalCourseTitle').textContent = '📚 新增課程';
  document.getElementById('courseId').value = '';
  document.getElementById('courseName').value = '';
  document.getElementById('courseCategory').value = '必修';
  document.getElementById('courseFee').value = '';
  document.getElementById('courseParentRatio').value = '1';
  document.getElementById('courseChildRatio').value = '0';
  document.getElementById('btnDeleteCourse').style.display = 'none';
  openModal('modalCourse');
}

function autoFillCourseRatio() {
  const cat = document.getElementById('courseCategory').value;
  const presets = {
    '必修': [1, 0],
    '半自付': [0.7, 0.3],
    '全自付': [0, 1]
  };
  const [p, c] = presets[cat] || [1, 0];
  document.getElementById('courseParentRatio').value = p;
  document.getElementById('courseChildRatio').value = c;
}

async function editCourse(id) {
  if (!isParent()) return;
  const res = await callApi('courseList', {});
  if (!res.ok) return;
  const c = res.data.find(x => x['課程ID'] === id);
  if (!c) return;
  editingCourse = c;
  document.getElementById('modalCourseTitle').textContent = '📝 編輯課程';
  document.getElementById('courseId').value = c['課程ID'];
  document.getElementById('courseName').value = c['課程名稱'];
  document.getElementById('courseCategory').value = c['分類'] || '必修';
  document.getElementById('courseFee').value = c['月費'] || '';
  document.getElementById('courseParentRatio').value = c['家長負擔比例'] || '1';
  document.getElementById('courseChildRatio').value = c['女兒負擔比例'] || '0';
  document.getElementById('btnDeleteCourse').style.display = '';
  openModal('modalCourse');
}

async function submitCourse() {
  const target = {
    '課程ID': document.getElementById('courseId').value,
    '課程名稱': document.getElementById('courseName').value,
    '分類': document.getElementById('courseCategory').value,
    '月費': parseInt(document.getElementById('courseFee').value) || 0,
    '家長負擔比例': parseFloat(document.getElementById('courseParentRatio').value) || 0,
    '女兒負擔比例': parseFloat(document.getElementById('courseChildRatio').value) || 0,
    '狀態': 'active'
  };
  if (!target['課程名稱']) { showToast('請填課程名稱'); return; }

  const res = await callApi('courseSave', { accountId: state.accountId, target });
  if (res.ok) {
    showToast('✅ 已儲存');
    closeModal('modalCourse');
    loadCourse();
  } else {
    showToast('失敗：' + res.error);
  }
}

async function deleteCourse() {
  if (!editingCourse) return;
  if (!confirm('確定刪除「' + editingCourse['課程名稱'] + '」？')) return;
  const res = await callApi('courseDelete', {
    accountId: state.accountId, id: editingCourse['課程ID']
  });
  if (res.ok) {
    showToast('✅ 已刪除');
    closeModal('modalCourse');
    loadCourse();
  }
}

// ========================================================
// 📊 月報
// ========================================================
async function loadReport() {
  const month = document.getElementById('reportMonth').value;
  if (!month) return;
  const res = await callApi('reportMonthly', { accountId: state.accountId, month });
  const container = document.getElementById('reportContent');
  if (res.ok) {
    const r = res.data;
    container.innerHTML = `
      <div class="report-grid">
        <div class="report-stat"><div class="label">總收入</div><div class="value" style="color:var(--green)">$${r['總收入']||0}</div></div>
        <div class="report-stat"><div class="label">總支出</div><div class="value" style="color:var(--red-seal)">$${r['總支出']||0}</div></div>
        <div class="report-stat"><div class="label">結餘</div><div class="value">$${r['結餘']||0}</div></div>
        <div class="report-stat"><div class="label">獎金總額</div><div class="value" style="color:var(--gold-deep)">$${r['獎金總額']||0}</div></div>
        <div class="report-stat"><div class="label">課程支出</div><div class="value">$${r['課程支出']||0}</div></div>
        <div class="report-stat"><div class="label">交易筆數</div><div class="value">${r['交易筆數']||0}</div></div>
      </div>
      <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--gold-deep)">
        ${month} 月度結算 · 自動計算
      </div>
    `;
  } else {
    container.innerHTML = '<div class="empty">無資料</div>';
  }
}

// ========================================================
// ⚙️ 設定
// ========================================================
async function loadSettings() {
  if (!isParent()) return;
  const res = await callApi('settingGet', {});
  const container = document.getElementById('settingList');
  if (res.ok) {
    container.innerHTML = res.data.map(s => `
      <div class="list-item">
        <div class="left">
          <div class="title">${s['說明']}</div>
          <div class="meta">${s['設定鍵']}</div>
        </div>
        <div class="amount">${s['設定值']}</div>
      </div>
    `).join('');
  }
}

async function changePassword() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;

  if (!/^\d{4}$/.test(newPwd)) { showToast('新密碼必須是 4 位數字'); return; }
  if (newPwd !== confirmPwd) { showToast('兩次新密碼不一致'); return; }

  const res = await callApi('memberChangePassword', {
    accountId: state.accountId,
    oldPassword: oldPwd,
    newPassword: newPwd
  });
  if (res.ok) {
    showToast('✅ 密碼已修改');
    document.getElementById('oldPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('confirmPwd').value = '';
  } else {
    showToast('失敗：' + res.error);
  }
}

// 啟動
init();

</script>
